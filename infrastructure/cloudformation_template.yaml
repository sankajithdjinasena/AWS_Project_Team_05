AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS CloudFormation Template for Telco Customer Churn Data Science Solution
  Group 07 - AWS Group Project Infrastructure setup including S3 Buckets, IAM Roles,
  AWS Lambda function, and AWS Glue Data Catalog Database.

Parameters:
  ProjectName:
    Type: String
    Default: telecom-churn-analytics
    Description: Base name for project resources

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod, test]
    Description: Environment stage

Resources:

  # 1. S3 Storage Bucket with SSE-S3 Encryption & Public Access Block
  TelcoDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-team07-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # 2. IAM Execution Role for AWS Lambda Data Validator
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  # 3. AWS Lambda Function for Data Schema & Quality Validation
  TelcoValidatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TelcoDatasetValidator
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import logging
          import urllib.parse
          import boto3
          import csv

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3_client = boto3.client('s3')

          REQUIRED_COLUMNS = [
              'customerID', 'gender', 'SeniorCitizen', 'Partner', 'Dependents',
              'tenure', 'PhoneService', 'MultipleLines', 'InternetService',
              'OnlineSecurity', 'OnlineBackup', 'DeviceProtection', 'TechSupport',
              'StreamingTV', 'StreamingMovies', 'Contract', 'PaperlessBilling',
              'PaymentMethod', 'MonthlyCharges', 'TotalCharges', 'Churn'
          ]

          def lambda_handler(event, context):
              logger.info("Received event: %s", json.dumps(event))
              record = event['Records'][0]
              bucket = record['s3']['bucket']['name']
              key = urllib.parse.unquote_plus(record['s3']['object']['key'])
              
              if not key.endswith('.csv'):
                  return {'statusCode': 400, 'body': json.dumps('Not a CSV file.')}
                  
              response = s3_client.get_object(Bucket=bucket, Key=key)
              lines = response['Body'].read().decode('utf-8').splitlines()
              reader = csv.reader(lines)
              header = next(reader)
              
              missing = [c for c in REQUIRED_COLUMNS if c not in header]
              if missing:
                  logger.error(f"Missing columns: {missing}")
                  return {'statusCode': 422, 'body': json.dumps({'missing': missing})}
                  
              logger.info(f"Schema validation PASSED for {len(lines)-1} rows.")
              return {'statusCode': 200, 'body': json.dumps('SUCCESS')}

  # 4. AWS Glue Data Catalog Database for Athena Analytics
  TelcoGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: telco_churn_db
        Description: Data Catalog database for Telco Customer Churn project analytics

Outputs:
  S3BucketName:
    Description: Created S3 Bucket Name
    Value: !Ref TelcoDataBucket
  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt TelcoValidatorLambda.Arn
  GlueDatabaseName:
    Description: AWS Glue Database Name
    Value: !Ref TelcoGlueDatabase
